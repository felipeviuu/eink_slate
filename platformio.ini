[platformio]
src_dir = eink_clap

[env:seeed_xiao_esp32s3_plus]
platform = espressif32 @ 6.6.0
board = seeed_xiao_esp32s3
framework = arduino

; Configuración específica para el modelo PLUS (16MB Flash / 8MB OPI PSRAM)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Habilitar USB CDC nativo y soporte de PSRAM
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

; Librería gráfica oficial Seeed_GFX2 (BLE y JSON son 100% nativos)
lib_deps = 
    https://github.com/Seeed-Studio/Seeed_GFX2.git

; Monitor Serie
monitor_speed = 115200